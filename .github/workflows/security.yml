name: Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run a weekly check every Monday at 8:00 AM UTC
    - cron: '0 8 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest  
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4